[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "workout_intel_core"
version = "0.0.1"
description = "ML and data processing hub for Vantage - Workout Tracking application."
authors = [
  { name = "Srujan Bali" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["workout_intel_core"]
include = ["pyproject.toml", "workout_intel_core/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["workout_intel_core"]
force-sort-within-sections = true

